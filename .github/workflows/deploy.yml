name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh ${VPS_USER}@${VPS_HOST} << 'ENDSSH'
            set -e
            cd ${VPS_PATH:-~/ai-job-intelligence-system}
            
            echo "📦 Pulling latest code..."
            git pull origin main || git pull origin master
            
            echo "🔧 Setting up environment..."
            if [ ! -f .env ]; then
              echo "⚠️  .env file not found. Please create it manually."
              exit 1
            fi
            
            echo "🐳 Building and starting Docker containers..."
            docker-compose -f infra/docker-compose.prod.yml down
            docker-compose -f infra/docker-compose.prod.yml build --no-cache
            docker-compose -f infra/docker-compose.prod.yml up -d
            
            echo "⏳ Waiting for services to be healthy..."
            sleep 15
            
            echo "🔄 Running database migrations..."
            docker-compose -f infra/docker-compose.prod.yml exec -T backend alembic upgrade head || echo "Migrations may have failed, check logs"
            
            echo "🎨 Building frontend..."
            cd frontend
            npm install --production=false
            npm run build
            cd ..
            
            echo "📦 Copying frontend build to nginx directory..."
            sudo mkdir -p /var/www/ai-job-intelligence/frontend
            sudo cp -r frontend/out/* /var/www/ai-job-intelligence/frontend/ || echo "Frontend build directory not found, skipping"
            
            echo "✅ Deployment complete!"
            echo "📊 Checking service status..."
            docker-compose -f infra/docker-compose.prod.yml ps
            
          ENDSSH

      - name: Health Check
        run: |
          sleep 20
          curl -f http://${{ secrets.VPS_HOST }}:8000/api/health || exit 1
          echo "✅ Health check passed!"
