name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Real Postgres with pgvector, so the full migration chain and the Postgres-only tests run too.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scratch
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            worker/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt -r worker/requirements.txt
          pip install pytest==9.1.1 ruff==0.17.1

      - name: Lint
        run: ruff check worker tests

      - name: Test
        run: pytest -rs
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5433/scratch

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the static export
        run: npx tsc --noEmit && npm run build
