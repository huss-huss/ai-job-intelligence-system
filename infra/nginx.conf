# Nginx configuration for AI Job Intelligence System
# Place in /etc/nginx/sites-available/ai-job-intelligence

upstream backend {
    server localhost:8000;
}

server {
    listen 80;
    server_name _;  # Catch-all - will handle requests when no other server_name matches

    # Frontend (Next.js static files)
    location / {
        root /home/hussen/ai-job-intelligence-system/frontend-out;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # API endpoints
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check
    location /health {
        proxy_pass http://backend/api/health;
        access_log off;
    }

    # Static assets
    location /_next/static {
        root /home/hussen/ai-job-intelligence-system/frontend-out;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
